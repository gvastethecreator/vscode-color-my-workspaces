name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run check-types
      - run: pnpm run check:release
      - run: pnpm run compile
      - if: runner.os == 'Windows'
        run: pnpm run check:media

  extension-host:
    name: Extension Host (${{ matrix.os }}, ${{ matrix.vscode }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            vscode: "1.134.0"
          - os: ubuntu-latest
            vscode: stable
          - os: ubuntu-latest
            vscode: insiders
          - os: windows-latest
            vscode: stable
          - os: macos-latest
            vscode: stable
    runs-on: ${{ matrix.os }}
    env:
      VSCODE_TEST_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run test:integration
      - if: runner.os != 'Linux'
        run: pnpm run test:integration

  package:
    name: Package and inspect VSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: xvfb-run -a pnpm run test:vsix
      - run: pnpm run check:performance
      - uses: actions/upload-artifact@v7
        with:
          name: color-my-workspaces-vsix
          path: "*.vsix"
          if-no-files-found: error
          retention-days: 30
