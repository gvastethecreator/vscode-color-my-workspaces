  <script>
    (() => {
      "use strict";

      const sourceData = JSON.parse(document.getElementById("codemap-data").textContent);
      const data = { ...sourceData, nodes: [], edges: [], flows: sourceData.flows };
      const sourceNodes = new Map(sourceData.nodes.map(node => [node.id, node]));
      const groups = new Map(sourceData.hierarchy.map(group => [group.id, group]));
      const descendants = new Map();
      function groupMembers(id) {
        if (!descendants.has(id)) descendants.set(id, groups.get(id).children.flatMap(child => child.kind === "node" ? [child.id] : groupMembers(child.id)));
        return descendants.get(id);
      }
      const explorer = { level: sourceData.nodes.length <= 20 ? "all" : ".", page: 0, total: 0, changes: false, connection: null, history: [] };
      const changedIds = new Set(sourceData.changes?.changed_node_ids || []);
      const MOTION = { quick: 140, panel: 220, camera: 280, ease: "cubic-bezier(.23, 1, .32, 1)" };
      const svg = document.getElementById("map-svg");
      const viewport = document.getElementById("viewport");

      const GRID = 4;
      const NODE_W = 360;
      const NODE_H = 132;
      const GAP = 96;
      const COL_PITCH = NODE_W + GAP;
      const ROW_PITCH = NODE_H + GAP;
      const ORIGIN_X = 48;
      const ORIGIN_Y = 64;
      const RADIUS = 10;
      const CARD_RADIUS_TL = 22;
      const CARD_RADIUS_TR = 6;
      const CARD_RADIUS_BR = 22;
      const CARD_RADIUS_BL = 6;
      const PAD_X = 24;
      const PAD_Y = 16;
      const TITLE_SIZE = 20;
      const PATH_SIZE = 15;
      const STAMP_SIZE = 13;
      const COPY_GAP = 8;
      const STAMP_Y = PAD_Y;
      const TITLE_Y = STAMP_Y + Math.round(STAMP_SIZE * 1.2) + COPY_GAP;
      const PATH_Y = TITLE_Y + Math.round(TITLE_SIZE * 1.15) + COPY_GAP;
      const LANE_STEP = 12;
      const LANE_GUTTER = 24;
      const LANE_COUNT = Math.max(2, Math.floor((GAP - LANE_GUTTER) / LANE_STEP) - 1);
      const LANE_CLEARANCE = 20;
      const PORT_MIN = 12;
      const SIDE_PORT_MAX = 4;
      const ZONE_TOP = 32;
      const ZONE_BOTTOM = 16;
      const ZONE_SIDE = 24;
      const HOP = 8;
      const LABEL_GAP = 8;
      const LABEL_H = 14;
      const LABEL_CHAR = 7;
      const LABEL_BUDGET = 14;
      const TAGS = { module: "MODULE", service: "SERVICE", database: "DATABASE", queue: "QUEUE", interface: "INTERFACE", external: "EXTERNAL" };
      const EDGE_TYPES = ["imports", "calls", "reads", "writes", "publishes", "subscribes", "registers"];
      const BOUNDARY_HUES = [210, 268, 328, 12, 28, 48, 196, 248, 302, 356, 38, 222, 278, 18, 145, 125, 90];
      const STATES = [
        ["selected", "selected"],
        ["callers", "callers"],
        ["dependencies", "callees"],
        ["flow", "saved path"],
        ["unknown", "unknown"]
      ];

      const types = [...new Set(["module", ...sourceData.nodes.map(node => node.type)])].sort();
      const boundaries = [...new Set([...sourceData.nodes.map(node => node.boundary), ...groups.keys()])].sort((a, b) => a.localeCompare(b));
      const boundaryIndexes = new Map(boundaries.map((boundary, index) => [boundary, index]));
      const state = {
        enabledTypes: new Set(types), query: "", selectedNode: null, selectedFlow: null, hoveredNode: null,
        cells: new Map(), overrides: new Map(), view: { x: 0, y: 0, k: 1 },
        counts: { nodes: 0, edges: 0 }, drag: null, pan: null, skipCanvasClick: false,
        viewAnimation: null
      };
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

      const snap = value => Math.round(value / GRID) * GRID;
      const colLeft = col => ORIGIN_X + col * COL_PITCH;
      const colRight = col => colLeft(col) + NODE_W;
      const rowTop = row => ORIGIN_Y + row * ROW_PITCH;
      const rowBottom = row => rowTop(row) + NODE_H;
      const laneY = (band, lane) => rowBottom(band) + LANE_GUTTER + LANE_STEP * lane;
      const laneX = (band, lane) => colRight(band) + LANE_GUTTER + LANE_STEP * lane;

      document.getElementById("generated-at").textContent = data.generated_at;
      document.getElementById("generated-commit").textContent = data.generated_from_commit.slice(0, 12);
      document.getElementById("scope").textContent = data.scope.join(", ");
      document.getElementById("scope").parentElement.title = data.scope.join(", ");
      document.getElementById("codemap-title").textContent = `Code map of ${document.getElementById("repo-name").textContent}`;
      document.getElementById("codemap-desc").textContent =
        `${sourceData.nodes.length} modules in ${sourceData.edges.length} traces` + (data.flows.length ? `, ${data.flows.length} saved paths.` : ".");

      function htmlElement(tag, className, text) {
        const element = document.createElement(tag);
        if (className) element.className = className;
        if (text !== undefined) element.textContent = text;
        return element;
      }

      function svgElement(tag, attributes = {}) {
        const element = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, value);
        return element;
      }

      const measureLayer = svgElement("g", { class: "node", "aria-hidden": "true", transform: "translate(-10000 -10000)" });
      const measureStamp = svgElement("text", { class: "boundary-stamp" });
      const measureTitle = svgElement("text", { class: "node-title" });
      const measurePath = svgElement("text", { class: "node-path" });
      measureLayer.append(measureStamp, measureTitle, measurePath);
      svg.append(measureLayer);
      function cardPlatePath(width = NODE_W, height = NODE_H) {
        const tl = CARD_RADIUS_TL;
        const tr = CARD_RADIUS_TR;
        const br = CARD_RADIUS_BR;
        const bl = CARD_RADIUS_BL;
        return [
          `M ${tl} 0`,
          `H ${width - tr}`,
          `A ${tr} ${tr} 0 0 1 ${width} ${tr}`,
          `V ${height - br}`,
          `A ${br} ${br} 0 0 1 ${width - br} ${height}`,
          `H ${bl}`,
          `A ${bl} ${bl} 0 0 1 0 ${height - bl}`,
          `V ${tl}`,
          `A ${tl} ${tl} 0 0 1 ${tl} 0`,
          "Z"
        ].join(" ");
      }

      const clipPath = document.getElementById("card-copy-clip-path");
      if (clipPath) clipPath.setAttribute("d", cardPlatePath());

      function fitText(value, probe, maxWidth) {
        probe.textContent = value;
        if (probe.getComputedTextLength() <= maxWidth) return value;
        let low = 0;
        let high = value.length;
        let best = "\u2026";
        while (low <= high) {
          const mid = Math.floor((low + high) / 2);
          const next = `${value.slice(0, Math.max(1, mid))}\u2026`;
          probe.textContent = next;
          if (probe.getComputedTextLength() <= maxWidth) {
            best = next;
            low = mid + 1;
          } else high = mid - 1;
        }
        return best;
      }

      function groupColor(boundary) {
        const index = boundaryIndexes.get(boundary) ?? 0;
        const hue = BOUNDARY_HUES[index % BOUNDARY_HUES.length];
        const root = getComputedStyle(document.documentElement);
        const sat = root.getPropertyValue("--boundary-saturation").trim() || "64%";
        const light = root.getPropertyValue("--boundary-lightness").trim() || "47%";
        return `hsl(${hue} ${sat} ${light})`;
      }

      function applyBoundaryStyle(element, boundary) {
        element.style.setProperty("--group-color", groupColor(boundary));
        element.dataset.boundary = boundary;
        element.dataset.boundaryIndex = String(boundaryIndexes.get(boundary) ?? 0);
        return element;
      }

      function projectView(animate = false) {
        stopViewAnimation();
        const query = state.query.trim().toLowerCase();
        let entries;
        if (state.selectedFlow !== null) {
          entries = [...new Set(sourceData.flows[state.selectedFlow].steps)].map(id => sourceNodes.get(id)).filter(Boolean);
        } else if (explorer.connection) {
          const ids = new Set([explorer.connection]);
          sourceData.edges.forEach(edge => { if (edge.from === explorer.connection || edge.to === explorer.connection) { ids.add(edge.from); ids.add(edge.to); } });
          entries = [...ids].map(id => sourceNodes.get(id));
        } else if (query || explorer.level === "all") {
          entries = sourceData.nodes.filter(node => `${node.id} ${node.label || ""} ${(node.symbols || []).join(" ")}`.toLowerCase().includes(query));
        } else {
          entries = groups.get(explorer.level).children.map(child => {
            if (child.kind === "node") return sourceNodes.get(child.id);
            const members = groupMembers(child.id);
            return { id: `group:${child.id}`, path: child.id, label: child.id.split("/").at(-1), type: "module", boundary: child.id,
              _group: child.id, _members: members, entrypoints: [], callers: [], callees: [], tests: [],
              evidence: { status: "inventory", locations: [] }, analysis: "group" };
          });
        }
        entries = entries.filter(node => node._group
          ? node._members.some(id => state.enabledTypes.has(sourceNodes.get(id).type) && (!explorer.changes || changedIds.has(id)))
          : state.enabledTypes.has(node.type) && (!explorer.changes || changedIds.has(node.id)));
        explorer.total = entries.length;
        explorer.page = Math.min(explorer.page, Math.max(0, Math.ceil(entries.length / 20) - 1));
        data.nodes = entries.slice(explorer.page * 20, (explorer.page + 1) * 20).map(node => ({ ...node, callers: [], callees: [] }));
        const membership = new Map();
        data.nodes.forEach(node => (node._members || [node.id]).forEach(id => membership.set(id, node.id)));
        const aggregate = new Map();
        sourceData.edges.forEach(edge => {
          const from = membership.get(edge.from), to = membership.get(edge.to);
          if (!from || !to || from === to) return;
          const key = `${from}\0${to}\0${edge.type}\0${Boolean(edge.type_only)}`;
          if (!aggregate.has(key)) aggregate.set(key, { ...edge, from, to, originals: [] });
          aggregate.get(key).originals.push(edge);
        });
        data.edges = [...aggregate.values()];
        const projected = new Map(data.nodes.map(node => [node.id, node]));
        data.edges.forEach(edge => { projected.get(edge.from).callees.push({ id: edge.to, type: edge.type }); projected.get(edge.to).callers.push({ id: edge.from, type: edge.type }); });
        if (state.selectedNode && !projected.has(state.selectedNode)) state.selectedNode = null;
        state.hoveredNode = null;
        state.overrides.clear();
        draw();
        renderNavigation();
        renderCardLegend();
        renderDetails();
        document.getElementById("empty-view").hidden = data.nodes.length > 0;
        document.getElementById("announcer").textContent = `${entries.length} modules in this view. Page ${explorer.page + 1}.`;
        fitMap({ overview: true, animate: animate && !keyboardInput() });
        if (animate && !reduceMotion.matches && !keyboardInput()) {
          viewport.querySelectorAll(".card-visual").forEach((card, index) => card.animate([
            { opacity: .2, transform: "translateY(10px)" }, { opacity: 1, transform: "translateY(0)" }
          ], { duration: MOTION.panel, delay: Math.min(index * 16, 100), easing: MOTION.ease }));
        }
      }

      function keyboardInput() { return document.documentElement.dataset.input === "keyboard"; }

      function navigate(level) {
        explorer.history.push({ level: explorer.level, page: explorer.page });
        explorer.level = level;
        explorer.changes = false;
        explorer.page = 0;
        explorer.connection = null;
        state.selectedNode = null;
        state.selectedFlow = null;
        state.query = "";
        document.getElementById("search").value = "";
        setPanel("right", true);
        projectView(true);
        renderFlows();
        if (keyboardInput()) viewport.querySelector(".node[data-node-id]")?.focus();
      }

      function renderNavigation() {
        const crumbs = document.getElementById("breadcrumbs");
        crumbs.replaceChildren();
        const add = (label, level) => {
          if (crumbs.childElementCount) crumbs.append(htmlElement("span", "", "/"));
          const button = htmlElement("button", "", label);
          button.type = "button";
          button.addEventListener("click", () => navigate(level));
          crumbs.append(button);
        };
        add("Repository", ".");
        if (state.query) add("Search results", "all");
        else if (state.selectedFlow !== null) add("Call path", "all");
        else if (explorer.connection) add("Connections", "all");
        else if (explorer.level === "all") add("All modules", "all");
        else if (explorer.level !== ".") {
          let path = "";
          explorer.level.split("/").forEach(part => { path = path ? path + "/" + part : part; add(part, path); });
        }
        const pages = Math.max(1, Math.ceil(explorer.total / 20));
        document.getElementById("page-label").textContent = `${explorer.page + 1} / ${pages} · ${explorer.total} modules`;
        document.getElementById("page-prev").disabled = explorer.page === 0;
        document.getElementById("page-next").disabled = explorer.page + 1 >= pages;
        const coverage = document.getElementById("coverage-view");
        coverage.textContent = `${sourceData.coverage.status} coverage`;
        coverage.dataset.quality = sourceData.coverage.status;
        document.getElementById("changes-view").setAttribute("aria-pressed", String(explorer.changes));
      }

      function revealNode(id) {
        if (!sourceNodes.has(id)) return;
        explorer.level = "all";
        explorer.connection = id;
        explorer.page = 0;
        explorer.changes = false;
        state.selectedFlow = null;
        state.query = "";
        document.getElementById("search").value = "";
        state.enabledTypes = new Set(types);
        projectView(true);
        state.selectedNode = id;
        renderTypes();
        renderDetails();
        paintPath();
        setPanel("right", false);
      }

      function evidenceBlock(location) {
        const block = htmlElement("div", "evidence-item");
        block.append(htmlElement("code", "", `${location.path}:${location.start_line ?? "?"}`));
        block.append(htmlElement("pre", "", location.symbol));
        block.append(htmlElement("small", "", location.extractor || "Fictional example"));
        return block;
      }

      function inspectEdge(edge) {
        state.hoveredNode = null;
        const details = document.getElementById("details");
        details.replaceChildren(htmlElement("h2", "detail-title", "Why this connection exists"));
        const originals = edge.originals || [edge];
        details.append(htmlElement("p", "detail-path", `${originals.length} source relationship${originals.length === 1 ? "" : "s"}. Static evidence.`));
        originals.slice(0, 30).forEach(item => {
          details.append(htmlElement("h3", "detail-section-label", `${item.from} → ${item.to} · ${item.type}${item.type_only ? " (type only)" : ""}`));
          item.evidence.locations.forEach(location => details.append(evidenceBlock(location)));
        });
        if (originals.length > 30) details.append(htmlElement("p", "empty", "Showing 30 relationships. Narrow the hierarchy to inspect the rest."));
        setPanel("right", false);
      }

      function inspectCoverage() {
        const coverage = sourceData.coverage, details = document.getElementById("details");
        details.replaceChildren(htmlElement("h2", "detail-title", "Analysis coverage"));
        details.append(htmlElement("p", "coverage-number", `${coverage.analyzed_files} / ${coverage.included_files}`));
        details.append(htmlElement("p", "detail-path", "Files analyzed with a supported extractor. This is not runtime or test coverage."));
        details.append(htmlElement("h3", "detail-section-label", `${coverage.unresolved_references.length} unresolved references and analysis limits`));
        coverage.unresolved_references.slice(0, 60).forEach(item => {
          const block = htmlElement("div", "evidence-item");
          block.append(htmlElement("code", "", `${item.path}:${item.line}`));
          block.append(htmlElement("p", "", item.reason));
          if (item.reference) block.append(htmlElement("pre", "", item.reference));
          details.append(block);
        });
        details.append(htmlElement("h3", "detail-section-label", `${coverage.omitted_untracked.length} untracked files omitted`));
        coverage.omitted_untracked.slice(0, 30).forEach(path => details.append(htmlElement("p", "detail-path", path)));
        details.append(htmlElement("p", "detail-path", `${coverage.excluded.length} files outside the analysis scope. Full details are in the JSON model.`));
        setPanel("right", false);
      }

      function inspectChanges() {
        const changes = sourceData.changes, details = document.getElementById("details");
        details.replaceChildren(htmlElement("h2", "detail-title", "Architecture changes"));
        if (!changes) details.append(htmlElement("p", "empty", "No comparison is attached to this generation."));
        else {
          [["added_nodes", "Added modules"], ["removed_nodes", "Removed modules"], ["added_edges", "Added connections"], ["removed_edges", "Removed connections"], ["boundary_changes", "Boundary changes"], ["new_cycles", "New cycles"]].forEach(([field, label]) => {
            details.append(htmlElement("h3", "detail-section-label", `${label} · ${changes[field].length}`));
            changes[field].slice(0, 30).forEach(item => {
              const text = item.from ? `${item.from} → ${item.to} · ${item.type}` : item.nodes ? item.nodes.join(" → ") : item.before ? `${item.id}: ${item.before} → ${item.after}` : item.id;
              const block = htmlElement("div", "evidence-item");
              block.append(htmlElement("p", "detail-path", text));
              (item.evidence?.locations || []).forEach(location => block.append(evidenceBlock(location)));
              details.append(block);
            });
            if (changes[field].length > 30) details.append(htmlElement("p", "empty", "Showing 30. The JSON comparison contains the full list."));
          });
        }
        setPanel("right", false);
      }

      function visibleNodes() {
        return data.nodes.filter(node => node._group || state.enabledTypes.has(node.type));
      }

      function visibleEdges(ids) {
        return data.edges.filter(edge => ids.has(edge.from) && ids.has(edge.to));
      }

      function nodeRanks(nodes, edges) {
        const ids = new Set(nodes.map(node => node.id));
        const outgoing = new Map([...ids].map(id => [id, []]));
        const incoming = new Map([...ids].map(id => [id, []]));
        const indegree = new Map([...ids].map(id => [id, 0]));
        const rank = new Map([...ids].map(id => [id, 0]));
        for (const edge of edges) {
          outgoing.get(edge.from).push(edge.to);
          incoming.get(edge.to).push(edge.from);
          indegree.set(edge.to, indegree.get(edge.to) + 1);
        }
        const queue = [...ids].filter(id => indegree.get(id) === 0).sort();
        const visited = new Set();
        while (queue.length) {
          const id = queue.shift();
          visited.add(id);
          for (const target of outgoing.get(id)) {
            rank.set(target, Math.max(rank.get(target), rank.get(id) + 1));
            indegree.set(target, indegree.get(target) - 1);
            if (indegree.get(target) === 0) queue.push(target);
          }
          queue.sort();
        }
        for (const id of [...ids].sort()) {
          if (visited.has(id)) continue;
          const parents = incoming.get(id).map(parent => rank.get(parent));
          rank.set(id, parents.length ? Math.min(5, Math.max(...parents) + 1) : 0);
        }
        return { rank, outgoing, incoming };
      }

      // Columns carry dependency rank. Each boundary owns a rectangle of rows, and two boundaries
      // share a row band only when their column ranges are disjoint, so zone rectangles never overlap.
      function calculateCells(nodes, edges) {
        const { rank } = nodeRanks(nodes, edges);
        const columnOf = id => Math.min(rank.get(id), 5);
        const groups = new Map();
        for (const node of nodes) {
          if (!groups.has(node.boundary)) groups.set(node.boundary, []);
          groups.get(node.boundary).push(node);
        }
        const specs = [...groups].map(([boundary, members]) => {
          const sorted = [...members].sort((a, b) => columnOf(a.id) - columnOf(b.id) || a.id.localeCompare(b.id));
          const rows = [];
          const placement = new Map();
          for (const node of sorted) {
            const col = columnOf(node.id);
            let index = rows.findIndex(used => !used.has(col));
            if (index === -1) {
              rows.push(new Set());
              index = rows.length - 1;
            }
            rows[index].add(col);
            placement.set(node.id, { row: index, col });
          }
          const columns = sorted.map(node => columnOf(node.id));
          return { boundary, placement, height: rows.length, min: Math.min(...columns), max: Math.max(...columns) };
        }).sort((a, b) => a.min - b.min || b.height - a.height || a.boundary.localeCompare(b.boundary));

        const cells = new Map();
        const bands = [];
        let nextRow = 0;
        for (const spec of specs) {
          let band = bands.find(candidate =>
            candidate.height >= spec.height && candidate.spans.every(([low, high]) => spec.max < low || spec.min > high));
          if (!band) {
            band = { row: nextRow, height: spec.height, spans: [] };
            nextRow += spec.height;
            bands.push(band);
          }
          band.spans.push([spec.min, spec.max]);
          for (const [id, cell] of spec.placement) cells.set(id, { row: band.row + cell.row, col: cell.col });
        }
        // Dense pages use a compact reading grid; edge routing still uses clear corridors.
        if (nodes.length > 12 && Math.max(...[...cells.values()].map(cell => cell.row)) > 6) {
          [...nodes].sort((a, b) => a.boundary.localeCompare(b.boundary) || columnOf(a.id) - columnOf(b.id) || a.id.localeCompare(b.id))
            .forEach((node, index) => cells.set(node.id, { col: index % 4, row: Math.floor(index / 4) }));
        }
        for (const [id, cell] of state.overrides) {
          if (!cells.has(id)) continue;
          const holder = [...cells].find(([other, value]) => other !== id && value.row === cell.row && value.col === cell.col);
          if (holder) cells.set(holder[0], cells.get(id));
          cells.set(id, { ...cell });
        }
        return cells;
      }

      function rectOf(id) {
        const cell = state.cells.get(id);
        return { x: colLeft(cell.col), y: rowTop(cell.row), row: cell.row, col: cell.col };
      }

      function laneAllocator() {
        const bands = new Map();
        return (key, start, end) => {
          const from = Math.min(start, end);
          const to = Math.max(start, end);
          let lanes = bands.get(key);
          if (!lanes) {
            lanes = [];
            bands.set(key, lanes);
          }
          for (let index = 0; index < lanes.length; index += 1) {
            if (from > lanes[index] + LANE_CLEARANCE) {
              lanes[index] = to;
              return index;
            }
          }
          if (lanes.length < LANE_COUNT) {
            lanes.push(to);
            return lanes.length - 1;
          }
          let best = 0;
          for (let index = 1; index < lanes.length; index += 1) if (lanes[index] < lanes[best]) best = index;
          lanes[best] = Math.max(lanes[best], to);
          return best;
        };
      }

      // Top and bottom ports of one column share a single fan per corridor: two stubs that meet in the
      // same corridor then always land at least PORT_MIN apart instead of nearly on top of each other.
      function assignPorts(requests) {
        const ports = new Map();
        const grouped = new Map();
        for (const request of requests) {
          if (!grouped.has(request.group)) grouped.set(request.group, []);
          grouped.get(request.group).push(request);
        }
        for (const members of grouped.values()) {
          const length = members[0].side === "top" || members[0].side === "bottom" ? NODE_W : NODE_H;
          const spacing = length / (members.length + 1);
          members.sort((a, b) => a.sort - b.sort || a.edge - b.edge);
          members.forEach((request, index) => {
            const ideal = spacing * (index + 1);
            const offset = spacing >= PORT_MIN + GRID ? snap(ideal) : ideal;
            ports.set(`${request.edge}\u0000${request.end}`, Math.min(length - PORT_MIN, Math.max(PORT_MIN, offset)));
          });
        }
        return ports;
      }

      // Every route travels inside node-free corridors, so a connector never crosses a box it does not touch.
      function calculateRoutes(edges) {
        const plans = edges.map((edge, index) => {
          const source = rectOf(edge.from);
          const target = rectOf(edge.to);
          const sameRow = source.row === target.row;
          const side = sameRow && Math.abs(target.col - source.col) === 1;
          return { edge, index, source, target, side };
        });
        const sideLoad = new Map();
        for (const plan of plans) {
          if (!plan.side) continue;
          const forward = plan.target.col > plan.source.col;
          for (const key of [`${plan.edge.from}\u0000${forward ? "right" : "left"}`, `${plan.edge.to}\u0000${forward ? "left" : "right"}`]) {
            sideLoad.set(key, (sideLoad.get(key) || 0) + 1);
          }
        }
        for (const plan of plans) {
          if (!plan.side) continue;
          const forward = plan.target.col > plan.source.col;
          const load = Math.max(
            sideLoad.get(`${plan.edge.from}\u0000${forward ? "right" : "left"}`) || 0,
            sideLoad.get(`${plan.edge.to}\u0000${forward ? "left" : "right"}`) || 0
          );
          if (load > SIDE_PORT_MAX) plan.side = false;
        }

        const requests = [];
        for (const plan of plans) {
          const forwardCol = plan.target.col > plan.source.col;
          if (plan.side) {
            const exit = forwardCol ? "right" : "left";
            const enter = forwardCol ? "left" : "right";
            requests.push({ edge: plan.index, end: "from", side: exit, group: `${plan.edge.from}\u0000${exit}`, sort: plan.target.y });
            requests.push({ edge: plan.index, end: "to", side: enter, group: `${plan.edge.to}\u0000${enter}`, sort: plan.source.y });
            continue;
          }
          const down = plan.target.row > plan.source.row;
          plan.exit = down || plan.target.row === plan.source.row ? "bottom" : "top";
          plan.enter = down ? "top" : "bottom";
          const exitBand = plan.exit === "bottom" ? plan.source.row : plan.source.row - 1;
          const enterBand = plan.enter === "top" ? plan.target.row - 1 : plan.target.row;
          requests.push({ edge: plan.index, end: "from", side: plan.exit, group: `c${plan.source.col}:${exitBand}`, sort: plan.target.x });
          requests.push({ edge: plan.index, end: "to", side: plan.enter, group: `c${plan.target.col}:${enterBand}`, sort: plan.source.x });
        }
        const ports = assignPorts(requests);

        // One allocator per corridor axis: every vertical run shares the column-band lanes.
        const columnLane = laneAllocator();
        for (const plan of plans) {
          if (plan.side) {
            const forward = plan.target.col > plan.source.col;
            plan.startY = plan.source.y + ports.get(`${plan.index}\u0000from`);
            plan.endY = plan.target.y + ports.get(`${plan.index}\u0000to`);
            if (plan.startY === plan.endY) continue;
            const band = forward ? plan.source.col : plan.target.col;
            plan.verticalX = laneX(band, columnLane(`v${band}`, plan.startY, plan.endY));
            continue;
          }
          if (Math.abs(plan.target.row - plan.source.row) < 2) continue;
          const band = plan.target.col > plan.source.col
            ? plan.target.col - 1
            : plan.target.col < plan.source.col ? plan.target.col : plan.source.col;
          const from = Math.min(plan.source.row, plan.target.row);
          const to = Math.max(plan.source.row, plan.target.row);
          plan.verticalX = laneX(band, columnLane(`v${band}`, rowBottom(from), rowTop(to)));
        }

        const rowLane = laneAllocator();
        const routes = [];
        for (const plan of plans) {
          const sourceOffset = ports.get(`${plan.index}\u0000from`);
          const targetOffset = ports.get(`${plan.index}\u0000to`);
          if (plan.side) {
            const forward = plan.target.col > plan.source.col;
            const startX = forward ? plan.source.x + NODE_W : plan.source.x;
            const endX = forward ? plan.target.x : plan.target.x + NODE_W;
            if (plan.startY === plan.endY) {
              routes.push({ index: plan.index, points: [{ x: startX, y: plan.startY }, { x: endX, y: plan.endY }] });
              continue;
            }
            routes.push({
              index: plan.index,
              points: [
                { x: startX, y: plan.startY },
                { x: plan.verticalX, y: plan.startY },
                { x: plan.verticalX, y: plan.endY },
                { x: endX, y: plan.endY }
              ]
            });
            continue;
          }
          const startX = plan.source.x + sourceOffset;
          const endX = plan.target.x + targetOffset;
          const startY = plan.exit === "top" ? plan.source.y : plan.source.y + NODE_H;
          const endY = plan.enter === "top" ? plan.target.y : plan.target.y + NODE_H;
          const distance = plan.target.row - plan.source.row;
          if (Math.abs(distance) < 2) {
            const band = distance < 0 ? plan.source.row - 1 : plan.source.row;
            const lane = rowLane(`h${band}`, Math.min(startX, endX), Math.max(startX, endX));
            const midY = laneY(band, lane);
            routes.push({
              index: plan.index,
              points: [{ x: startX, y: startY }, { x: startX, y: midY }, { x: endX, y: midY }, { x: endX, y: endY }]
            });
            continue;
          }
          const exitBand = distance > 0 ? plan.source.row : plan.source.row - 1;
          const enterBand = distance > 0 ? plan.target.row - 1 : plan.target.row;
          const exitY = laneY(exitBand, rowLane(`h${exitBand}`, Math.min(startX, plan.verticalX), Math.max(startX, plan.verticalX)));
          const enterY = laneY(enterBand, rowLane(`h${enterBand}`, Math.min(endX, plan.verticalX), Math.max(endX, plan.verticalX)));
          routes.push({
            index: plan.index,
            points: [
              { x: startX, y: startY },
              { x: startX, y: exitY },
              { x: plan.verticalX, y: exitY },
              { x: plan.verticalX, y: enterY },
              { x: endX, y: enterY },
              { x: endX, y: endY }
            ]
          });
        }
        return routes;
      }

      function segmentsOf(route) {
        const segments = [];
        for (let index = 0; index < route.points.length - 1; index += 1) {
          const from = route.points[index];
          const to = route.points[index + 1];
          if (from.x === to.x && from.y === to.y) continue;
          segments.push({
            route: route.index,
            segment: index,
            horizontal: from.y === to.y,
            fixed: from.y === to.y ? from.y : from.x,
            from: from.y === to.y ? from.x : from.y,
            to: from.y === to.y ? to.x : to.y
          });
        }
        return segments;
      }

      // The lower-priority connector hops over the crossing so both stay traceable.
      function calculateHops(routes, priority) {
        const all = routes.flatMap(segmentsOf);
        const hops = new Map();
        const between = (value, a, b) => value > Math.min(a, b) + HOP + 2 && value < Math.max(a, b) - HOP - 2;
        for (const first of all) {
          if (!first.horizontal) continue;
          for (const second of all) {
            if (second.horizontal || second.route === first.route) continue;
            if (!between(second.fixed, first.from, first.to)) continue;
            if (!between(first.fixed, second.from, second.to)) continue;
            const target = (priority.get(first.route) ?? 1) <= (priority.get(second.route) ?? 1) ? first : second;
            const key = `${target.route}\u0000${target.segment}`;
            if (!hops.has(key)) hops.set(key, []);
            hops.get(key).push(target.horizontal ? second.fixed : first.fixed);
          }
        }
        return hops;
      }

      function buildPath(points, hops) {
        const sign = value => (value > 0 ? 1 : value < 0 ? -1 : 0);
        let path = `M ${points[0].x} ${points[0].y}`;
        for (let index = 1; index < points.length; index += 1) {
          const previous = points[index - 1];
          const current = points[index];
          const next = points[index + 1];
          const horizontal = previous.y === current.y;
          const direction = horizontal ? sign(current.x - previous.x) : sign(current.y - previous.y);
          const length = horizontal ? Math.abs(current.x - previous.x) : Math.abs(current.y - previous.y);
          let radius = 0;
          if (next) {
            const nextLength = next.y === current.y ? Math.abs(next.x - current.x) : Math.abs(next.y - current.y);
            radius = Math.min(RADIUS, length / 2, nextLength / 2);
          }
          const positions = (hops.get(`${index - 1}`) || [])
            .map(value => (value - (horizontal ? previous.x : previous.y)) * direction)
            .filter(value => value > HOP + 4 && value < length - radius - HOP - 4)
            .sort((a, b) => a - b);
          for (const position of positions) {
            const enter = position - HOP;
            const leave = position + HOP;
            if (horizontal) {
              const y = current.y;
              path += ` L ${previous.x + direction * enter} ${y}`;
              path += ` A ${HOP} ${HOP} 0 0 ${direction > 0 ? 1 : 0} ${previous.x + direction * leave} ${y}`;
            } else {
              const x = current.x;
              path += ` L ${x} ${previous.y + direction * enter}`;
              path += ` A ${HOP} ${HOP} 0 0 ${direction > 0 ? 0 : 1} ${x} ${previous.y + direction * leave}`;
            }
          }
          const stopX = horizontal ? current.x - direction * radius : current.x;
          const stopY = horizontal ? current.y : current.y - direction * radius;
          path += ` L ${stopX} ${stopY}`;
          if (next && radius > 1) {
            const nextHorizontal = next.y === current.y;
            const outward = nextHorizontal ? sign(next.x - current.x) : sign(next.y - current.y);
            const resumeX = nextHorizontal ? current.x + outward * radius : current.x;
            const resumeY = nextHorizontal ? current.y : current.y + outward * radius;
            const inX = horizontal ? direction : 0;
            const inY = horizontal ? 0 : direction;
            const outX = nextHorizontal ? outward : 0;
            const outY = nextHorizontal ? 0 : outward;
            const sweep = inX * outY - inY * outX > 0 ? 1 : 0;
            path += ` A ${radius} ${radius} 0 0 ${sweep} ${resumeX} ${resumeY}`;
          }
        }
        return path;
      }

      function labelPlacement(points, text) {
        let best = null;
        for (let index = 0; index < points.length - 1; index += 1) {
          const from = points[index];
          const to = points[index + 1];
          const horizontal = from.y === to.y;
          const length = horizontal ? Math.abs(to.x - from.x) : Math.abs(to.y - from.y);
          if (!best || length > best.length) best = { from, to, horizontal, length };
        }
        const width = text.length * LABEL_CHAR + 8;
        if (!best || best.length < width + 24) return null;
        if (best.horizontal) {
          const centerX = (best.from.x + best.to.x) / 2;
          const y = best.from.y;
          const above = y - rowBottom(Math.floor((y - ORIGIN_Y) / ROW_PITCH)) >= LABEL_GAP + LABEL_H + GRID;
          const maskY = above ? y - LABEL_GAP - LABEL_H : y + LABEL_GAP;
          return {
            mask: { x: centerX - width / 2, y: maskY, width, height: LABEL_H },
            text: { x: centerX, y: maskY + 9, anchor: "middle" }
          };
        }
        const centerY = (best.from.y + best.to.y) / 2;
        const x = best.from.x;
        const room = GAP - ((x - colRight(Math.floor((x - ORIGIN_X) / COL_PITCH))) % GAP);
        const right = room >= width + LABEL_GAP + GRID;
        const maskX = right ? x + LABEL_GAP : x - LABEL_GAP - width;
        return {
          mask: { x: maskX, y: centerY - LABEL_H / 2, width, height: LABEL_H },
          text: { x: right ? maskX + 4 : maskX + width - 4, y: centerY + 3, anchor: right ? "start" : "end" }
        };
      }

      function originId() {
        return state.hoveredNode || state.selectedNode;
      }

      function graphSets(ids, edges, start = originId()) {
        const outgoing = new Map([...ids].map(id => [id, []]));
        const incoming = new Map([...ids].map(id => [id, []]));
        edges.forEach(edge => { outgoing.get(edge.from).push(edge.to); incoming.get(edge.to).push(edge.from); });
        const walk = (origin, adjacency) => {
          const found = new Set();
          const pending = [...(adjacency.get(origin) || [])];
          while (pending.length) {
            const id = pending.shift();
            if (found.has(id)) continue;
            found.add(id);
            pending.push(...(adjacency.get(id) || []));
          }
          found.delete(origin);
          return found;
        };
        return {
          upstream: start ? walk(start, incoming) : new Set(),
          downstream: start ? walk(start, outgoing) : new Set()
        };
      }

      function pathContext() {
        const nodes = visibleNodes();
        const ids = new Set(nodes.map(node => node.id));
        const edges = visibleEdges(ids);
        const origin = originId();
        const selection = graphSets(ids, edges, origin);
        const selectedFlow = state.selectedFlow === null ? null : data.flows[state.selectedFlow];
        const selectedFlowNodes = new Set(selectedFlow?.steps || []);
        const selectedFlowPairs = flowPairs();
        const query = state.query.trim().toLowerCase();
        const matches = new Set(nodes
          .filter(node => `${node.id} ${node.path} ${node.role || ""}`.toLowerCase().includes(query))
          .map(node => node.id));
        return {
          nodes, ids, edges, origin, selection, selectedFlowNodes, selectedFlowPairs, query, matches,
          hasFocus: Boolean(origin || selectedFlow || query)
        };
      }

      function classesForEdge(edge, ctx) {
        const pair = `${edge.from}\u0000${edge.to}`;
        const classes = ["edge"];
        if (edge.evidence.status === "unknown") classes.push("unknown");
        if (ctx.selectedFlowPairs.has(pair)) return [...classes, "flow"];
        const origin = ctx.origin;
        const { selection } = ctx;
        let hot = false;
        if (origin) {
          if (selection.upstream.has(edge.from) && (selection.upstream.has(edge.to) || edge.to === origin)) hot = true;
          if ((edge.from === origin || selection.downstream.has(edge.from)) && selection.downstream.has(edge.to)) hot = true;
        }
        if (hot) classes.push("hot");
        if (!hot && ctx.hasFocus) classes.push("dim");
        return classes;
      }

      function classesForNode(node, ctx) {
        const classes = ["node"];
        if (node.id === state.selectedNode || node.id === ctx.origin) classes.push("focus");
        else if (ctx.selectedFlowNodes.has(node.id)) classes.push("flow");
        else {
          if (ctx.selection.upstream.has(node.id) || ctx.selection.downstream.has(node.id)) classes.push("hot");
          if (ctx.query && ctx.matches.has(node.id)) classes.push("match");
          if (classes.length === 1 && ctx.hasFocus) classes.push("dim");
        }
        return classes;
      }

      function paintPath() {
        const ctx = pathContext();
        for (const element of viewport.querySelectorAll(".node")) {
          const node = data.nodes.find(item => item.id === element.dataset.nodeId);
          if (!node) continue;
          element.setAttribute("class", classesForNode(node, ctx).join(" "));
          element.setAttribute("aria-pressed", String(node.id === state.selectedNode));
        }
        for (const element of viewport.querySelectorAll(".edge-bundle")) {
          const edge = ctx.edges[Number(element.dataset.index)];
          if (!edge) continue;
          const classes = classesForEdge(edge, ctx);
          element.classList.toggle("blend", classes.includes("hot") || classes.includes("flow"));
        }
        for (const element of viewport.querySelectorAll("path.edge")) {
          const edge = ctx.edges[Number(element.dataset.index)];
          if (!edge) continue;
          element.setAttribute("class", classesForEdge(edge, ctx).join(" "));
        }
        for (const element of viewport.querySelectorAll("path.edge-march")) {
          const edge = ctx.edges[Number(element.dataset.index)];
          if (!edge) continue;
          const classes = classesForEdge(edge, ctx);
          element.classList.toggle("on", classes.includes("hot") || classes.includes("flow"));
        }
        for (const element of viewport.querySelectorAll(".edge-label, .edge-mask")) {
          const edge = ctx.edges[Number(element.dataset.index)];
          if (!edge) continue;
          element.style.opacity = classesForEdge(edge, ctx).includes("dim") ? "0" : "1";
        }
      }

      function flowPairs() {
        if (state.selectedFlow === null) return new Set();
        const steps = data.flows[state.selectedFlow].steps;
        return new Set(steps.slice(0, -1).map((id, index) => `${id}\u0000${steps[index + 1]}`));
      }

      function zoneBoxes(nodes) {
        const groups = new Map();
        for (const node of nodes) {
          if (!groups.has(node.boundary)) groups.set(node.boundary, []);
          groups.get(node.boundary).push(rectOf(node.id));
        }
        return [...groups].map(([name, rects]) => {
          const first = Math.min(...rects.map(rect => rect.row));
          const last = Math.max(...rects.map(rect => rect.row));
          const minX = Math.min(...rects.map(rect => rect.x)) - ZONE_SIDE;
          const maxX = Math.max(...rects.map(rect => rect.x)) + NODE_W + ZONE_SIDE;
          const top = rowTop(first) - ZONE_TOP;
          const bottom = rowBottom(last) + ZONE_BOTTOM;
          return { name, x: minX, y: top, width: maxX - minX, height: bottom - top };
        });
      }

      function draw() {
        const ctx = pathContext();
        const { nodes, ids, edges } = ctx;
        state.cells = calculateCells(nodes, edges);
        state.counts = { nodes: nodes.length, edges: edges.length };
        viewport.replaceChildren();

        const edgeClasses = edges.map(edge => classesForEdge(edge, ctx));
        const routes = calculateRoutes(edges);
        const priority = new Map(routes.map(route => {
          const classes = edgeClasses[route.index];
          if (classes.includes("dim")) return [route.index, 0];
          if (classes.includes("flow")) return [route.index, 3];
          if (classes.includes("hot")) return [route.index, 2];
          return [route.index, 1];
        }));
        const hops = calculateHops(routes, priority);
        const showLabels = ctx.hasFocus || edges.length <= LABEL_BUDGET;

        for (const route of routes) {
          const classes = edgeClasses[route.index];
          const segmentHops = new Map();
          for (const [key, values] of hops) {
            const [index, segment] = key.split("\u0000");
            if (Number(index) === route.index) segmentHops.set(segment, values);
          }
          const edge = edges[route.index];
          const edgePath = buildPath(route.points, segmentHops);
          const start = route.points[0];
          const end = route.points[route.points.length - 1];
          const axis = start.x === end.x && start.y === end.y
            ? { x1: start.x, y1: start.y, x2: start.x + 1, y2: start.y }
            : { x1: start.x, y1: start.y, x2: end.x, y2: end.y };
          const fromNode = data.nodes.find(item => item.id === edge.from);
          const toNode = data.nodes.find(item => item.id === edge.to);
          const blendId = `edge-blend-${route.index}`;
          const bundle = svgElement("g", {
            class: "edge-bundle",
            "data-index": route.index, "data-from": edge.from, "data-to": edge.to, "data-edge-type": edge.type
          });
          if (fromNode) bundle.style.setProperty("--from-card", groupColor(fromNode.boundary));
          if (toNode) bundle.style.setProperty("--to-card", groupColor(toNode.boundary));
          bundle.classList.toggle("blend", classes.includes("hot") || classes.includes("flow"));
          const blend = svgElement("linearGradient", {
            id: blendId,
            gradientUnits: "userSpaceOnUse",
            x1: String(axis.x1),
            y1: String(axis.y1),
            x2: String(axis.x2),
            y2: String(axis.y2)
          });
          blend.append(
            svgElement("stop", { class: "edge-blend-from", offset: "0" }),
            svgElement("stop", { class: "edge-blend-mid", offset: ".5" }),
            svgElement("stop", { class: "edge-blend-to", offset: "1" })
          );
          const defs = svgElement("defs");
          defs.append(blend);
          const painted = svgElement("path", {
            class: classes.join(" "), d: edgePath,
            "data-index": route.index, "data-from": edge.from, "data-to": edge.to, "data-edge-type": edge.type
          });
          painted.style.setProperty("--edge-paint", `url(#${blendId})`);
          bundle.append(
            defs,
            svgElement("path", {
              class: "edge-hit", d: edgePath, "aria-hidden": "true",
              "data-index": route.index, "data-from": edge.from, "data-to": edge.to, "data-edge-type": edge.type
            }),
            painted,
            svgElement("path", {
              class: classes.includes("hot") || classes.includes("flow") ? "edge-march on" : "edge-march",
              d: edgePath,
              "data-index": route.index, "data-from": edge.from, "data-to": edge.to, "data-edge-type": edge.type
            })
          );
          if (showLabels) {
            const text = edge.type.toUpperCase();
            const placement = labelPlacement(route.points, text);
            if (placement) {
              const mask = svgElement("rect", {
                class: "edge-mask", "data-index": route.index, "data-edge-type": edge.type, x: placement.mask.x, y: placement.mask.y,
                width: placement.mask.width, height: placement.mask.height, rx: 2
              });
              const label = svgElement("text", {
                class: "edge-label", "data-index": route.index, "data-edge-type": edge.type,
                x: placement.text.x, y: placement.text.y, "text-anchor": placement.text.anchor
              });
              label.textContent = text;
              if (classes.includes("dim")) {
                mask.style.opacity = "0";
                label.style.opacity = "0";
              }
              bundle.append(mask, label);
            }
          }
          viewport.append(bundle);
          const hit = bundle.querySelector(".edge-hit");
          hit.setAttribute("role", "button");
          hit.setAttribute("tabindex", "0");
          hit.setAttribute("aria-label", `${edge.from} to ${edge.to}: ${edge.type}. Inspect evidence`);
          hit.addEventListener("pointerdown", event => event.stopPropagation());
          hit.addEventListener("click", event => { event.stopPropagation(); inspectEdge(edge); });
          hit.addEventListener("keydown", event => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); inspectEdge(edge); } });
        }

        for (const [index, node] of nodes.entries()) {
          const rect = rectOf(node.id);
          const group = applyBoundaryStyle(svgElement("g", {
            class: classesForNode(node, ctx).join(" "), transform: `translate(${rect.x} ${rect.y})`,
            tabindex: "0", role: "button", "aria-label": `${node.id}, ${node.type}, ${node.boundary}`
          }), node.boundary);
          group.dataset.nodeId = node.id;
          group.dataset.type = node.type;
          group.setAttribute("aria-pressed", String(node.id === state.selectedNode));
          if (node._group) group.dataset.group = node._group;
          const inner = NODE_W - PAD_X * 2;
          const card = svgElement("g", { class: "card-visual" });
          const plate = className => svgElement("path", { class: className, d: cardPlatePath() });
          const washId = `card-wash-${index}`;
          const wash = svgElement("linearGradient", {
            id: washId,
            gradientUnits: "objectBoundingBox",
            x1: "0.1",
            y1: "0",
            x2: "0.84",
            y2: "1"
          });
          wash.append(
            svgElement("stop", { class: "wash-a", offset: "0" }),
            svgElement("stop", { class: "wash-b", offset: ".46" }),
            svgElement("stop", { class: "wash-c", offset: "1" })
          );
          const scrim = plate("card-scrim");
          scrim.setAttribute("fill", `url(#${washId})`);
          card.append(plate("box"), plate("card-lip"), wash, scrim);
          const copy = svgElement("g", { class: "card-copy", "clip-path": "url(#card-copy-clip)" });
          const stamp = svgElement("text", { class: "boundary-stamp", x: PAD_X, y: STAMP_Y });
          stamp.textContent = fitText(node._group ? `${node._members.length} modules · open group ↗` : node.boundary, measureStamp, inner);
          const title = svgElement("text", { class: "node-title", x: PAD_X, y: TITLE_Y });
          title.textContent = fitText(node.label || node.id, measureTitle, inner);
          const path = svgElement("text", { class: "node-path", x: PAD_X, y: PATH_Y });
          path.textContent = fitText(node.path, measurePath, inner);
          copy.append(stamp, title, path);
          card.append(copy);
          if (changedIds.has(node.id) || node._members?.some(id => changedIds.has(id))) card.append(svgElement("circle", { class: "change-dot", cx: NODE_W - 18, cy: 18, r: 5 }));
          group.append(card);
          group.addEventListener("click", event => {
            event.stopPropagation();
            if (state.skipCanvasClick) {
              state.skipCanvasClick = false;
              return;
            }
            selectNode(node.id);
          });
          group.addEventListener("dblclick", event => {
            event.preventDefault();
            event.stopPropagation();
            if (node._group) navigate(node._group);
            else focusConnections(node.id);
          });
          group.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") { event.preventDefault(); if (node._group && event.key === "Enter") navigate(node._group); else selectNode(node.id); }
            if (event.key.toLowerCase() === "f") { event.preventDefault(); focusConnections(node.id, { animate: false }); }
            if (["ArrowRight", "ArrowDown", "ArrowLeft", "ArrowUp"].includes(event.key)) {
              event.preventDefault();
              const next = index + (["ArrowRight", "ArrowDown"].includes(event.key) ? 1 : -1);
              viewport.querySelectorAll(".node")[Math.max(0, Math.min(nodes.length - 1, next))]?.focus();
            }
          });
          group.addEventListener("pointerdown", event => {
            event.stopPropagation();
            stopViewAnimation();
            group.getAnimations({ subtree: true }).forEach(animation => animation.cancel());
            state.skipCanvasClick = false;
            svg.setPointerCapture(event.pointerId);
            state.drag = { id: node.id, pointerId: event.pointerId, x: event.clientX, y: event.clientY, start: { ...rect }, moved: false, offset: { x: 0, y: 0 } };
          });
          group.addEventListener("pointerenter", () => {
            if (state.drag) return;
            state.hoveredNode = node.id;
            paintPath();
          });
          group.addEventListener("pointerleave", () => {
            if (state.drag) return;
            if (state.hoveredNode === node.id) {
              state.hoveredNode = null;
              paintPath();
            }
          });
          viewport.append(group);
        }
        applyTransform();
      }

      function applyTransform() {
        viewport.setAttribute("transform", `translate(${state.view.x} ${state.view.y}) scale(${state.view.k})`);
        updateStatus();
      }

      function contentBox(nodeIds = null) {
        const nodes = visibleNodes().filter(node => !nodeIds || nodeIds.has(node.id));
        if (!nodes.length) return null;
        const rects = nodes.map(node => rectOf(node.id));
        const outer = nodeIds ? GRID * 7 : ZONE_SIDE + GRID * 4;
        return {
          minX: Math.min(...rects.map(rect => rect.x)) - outer,
          minY: Math.min(...rects.map(rect => rect.y)) - outer,
          maxX: Math.max(...rects.map(rect => rect.x)) + NODE_W + outer,
          maxY: Math.max(...rects.map(rect => rect.y)) + NODE_H + outer
        };
      }

      function viewForBox(box, padding = 48, maxScale = 1.15, minScale = .12) {
        const width = svg.clientWidth;
        const height = svg.clientHeight;
        const spanX = box.maxX - box.minX;
        const spanY = box.maxY - box.minY;
        const top = 132, bottom = 80;
        const k = Math.min(maxScale, Math.max(minScale, Math.min((width - padding) / spanX, (height - top - bottom) / spanY)));
        return {
          k,
          x: (width - spanX * k) / 2 - box.minX * k,
          y: top + (height - top - bottom - spanY * k) / 2 - box.minY * k
        };
      }

      function stopViewAnimation() {
        state.viewTarget = null;
        if (state.viewAnimation === null) return;
        cancelAnimationFrame(state.viewAnimation);
        state.viewAnimation = null;
      }

      function setView(target, animate = false) {
        stopViewAnimation();
        if (!animate || reduceMotion.matches || keyboardInput()) {
          state.view = { ...target };
          applyTransform();
          return;
        }
        const start = { ...state.view };
        state.viewTarget = { ...target };
        const startedAt = performance.now();
        const tick = now => {
          const progress = Math.min(1, (now - startedAt) / MOTION.camera);
          const eased = 1 - Math.pow(1 - progress, 4);
          state.view = {
            x: start.x + (target.x - start.x) * eased,
            y: start.y + (target.y - start.y) * eased,
            k: start.k + (target.k - start.k) * eased
          };
          applyTransform();
          if (progress < 1) state.viewAnimation = requestAnimationFrame(tick);
          else { state.viewAnimation = null; state.viewTarget = null; }
        };
        state.viewAnimation = requestAnimationFrame(tick);
      }

      function fitMap(options = {}) {
        const box = contentBox();
        if (!box) return;
        const minScale = .12;
        setView(viewForBox(box, 48, 1.15, minScale), Boolean(options.animate));
      }

      function connectionIds(id) {
        const nodes = visibleNodes();
        const ids = new Set(nodes.map(node => node.id));
        const connected = new Set([id]);
        for (const edge of visibleEdges(ids)) {
          if (edge.from === id) connected.add(edge.to);
          if (edge.to === id) connected.add(edge.from);
        }
        return connected;
      }

      function focusConnections(id = state.selectedNode, options = {}) {
        if (!id) return;
        const selected = data.nodes.find(node => node.id === id);
        if (selected?._group) { navigate(selected._group); return; }
        if (explorer.connection !== id) {
          explorer.connection = id;
          explorer.page = 0;
          state.selectedFlow = null;
          state.query = "";
          document.getElementById("search").value = "";
          projectView(false);
        }
        state.selectedNode = id;
        state.selectedFlow = null;
        renderFlows();
        renderDetails();
        paintPath();
        setPanel("right", false);
        const box = contentBox(connectionIds(id));
        if (box) setView(viewForBox(box, 72, 1.65), options.animate !== false);
      }

      function refitCurrentView() {
        if (state.selectedNode) {
          const box = contentBox(connectionIds(state.selectedNode));
          if (box) setView(viewForBox(box, 72, 1.65));
          return;
        }
        if (state.selectedFlow !== null) {
          const box = contentBox(new Set(data.flows[state.selectedFlow].steps));
          if (box) setView(viewForBox(box, 72, 1.4));
          return;
        }
        fitMap({ overview: true });
      }

      function setZoom(factor, anchor = null, animate = true) {
        const current = animate && state.viewTarget ? state.viewTarget : state.view;
        const next = Math.min(2.5, Math.max(.1, current.k * factor));
        const centerX = anchor?.x ?? svg.clientWidth / 2;
        const centerY = anchor?.y ?? svg.clientHeight / 2;
        setView({ x: centerX - (centerX - current.x) * (next / current.k),
          y: centerY - (centerY - current.y) * (next / current.k), k: next }, animate);
      }

      function selectNode(id) {
        stopViewAnimation();
        state.selectedNode = state.selectedNode === id ? null : id;
        renderFlows();
        renderDetails();
        setPanel("right", !state.selectedNode);
        if (state.selectedNode) {
          const rect = rectOf(state.selectedNode);
          const right = (rect.x + NODE_W) * state.view.k + state.view.x;
          const available = svg.clientWidth - 356;
          if (right > available) setView({ ...state.view, x: state.view.x - (right - available) }, true);
        }
        paintPath();
        updateStatus();
      }

      function renderDetails() {
        const details = document.getElementById("details");
        document.getElementById("focus-connections").disabled = !state.selectedNode;
        details.replaceChildren();
        const projected = data.nodes.find(item => item.id === state.selectedNode);
        const node = sourceNodes.get(state.selectedNode) || projected;
        if (!node) {
          details.append(htmlElement("p", "empty", "Select a module to read its source evidence, connections, and related tests."));
          return;
        }
        details.append(applyBoundaryStyle(htmlElement("p", "detail-boundary", node.boundary), node.boundary));
        details.append(htmlElement("h2", "detail-title", node.label || node.id));
        details.append(htmlElement("p", "detail-path", node.path));
        const action = (label, run) => {
          const button = htmlElement("button", "detail-action", label);
          button.type = "button";
          button.addEventListener("click", run);
          details.append(button);
        };
        if (node._group) {
          action("Open group ↗", () => navigate(node._group));
          details.append(htmlElement("p", "detail-path", `${node._members.length} modules. Double-click the card or press Enter to explore.`));
          node._members.slice(0, 30).forEach(id => {
            const button = htmlElement("button", "detail-link", sourceNodes.get(id).label || id);
            button.append(htmlElement("span", "", id));
            button.addEventListener("click", () => revealNode(id));
            details.append(button);
          });
          return;
        }
        action("Focus connections", () => focusConnections(node.id));
        details.append(htmlElement("p", "detail-path", `${node.evidence.status} evidence · ${node.analysis || "example"}`));
        if (node.entrypoints.length) {
          details.append(htmlElement("h3", "detail-section-label", "Recognized entrypoints"));
          node.entrypoints.forEach(entry => details.append(htmlElement("p", "detail-path", entry)));
        }
        details.append(htmlElement("h3", "detail-section-label", "Source evidence"));
        node.evidence.locations.forEach(location => details.append(evidenceBlock(location)));
        const relationships = sourceData.edges.filter(edge => edge.from === node.id || edge.to === node.id);
        details.append(htmlElement("h3", "detail-section-label", `${relationships.length} connections · click to inspect`));
        relationships.slice(0, 40).forEach(edge => {
          const direction = edge.from === node.id ? "→" : "←";
          const peer = edge.from === node.id ? edge.to : edge.from;
          const button = htmlElement("button", "detail-link", `${direction} ${sourceNodes.get(peer)?.label || peer}`);
          button.append(htmlElement("span", "", `${edge.type}${edge.type_only ? " · type only" : ""} · ${peer}`));
          button.addEventListener("click", () => inspectEdge(edge));
          details.append(button);
        });
        details.append(htmlElement("h3", "detail-section-label", `${node.tests.length} related tests`));
        if (!node.tests.length) details.append(htmlElement("p", "empty", "No direct test reference was found."));
        node.tests.forEach(test => {
          const button = htmlElement("button", "detail-link", test);
          button.addEventListener("click", () => revealNode(test));
          details.append(button);
        });
        const gaps = sourceData.coverage.unresolved_references.filter(item => item.path === node.path);
        if (gaps.length) {
          details.append(htmlElement("h3", "detail-section-label", "Analysis limits for this file"));
          gaps.forEach(gap => details.append(htmlElement("p", "detail-path", `${gap.reason} · line ${gap.line}`)));
        }
      }

      function renderCardLegend() {
        const legend = document.getElementById("card-legend");
        legend.replaceChildren(htmlElement("p", "legend-title", "Visible groups"));
        const visible = [...new Set(data.nodes.map(node => node.boundary))];
        visible.slice(0, 6).forEach(boundary => {
          const row = applyBoundaryStyle(htmlElement("div", "legend-row"), boundary);
          row.append(htmlElement("span", "boundary-chip"), document.createTextNode(boundary));
          legend.append(row);
        });
        if (visible.length > 6) legend.append(htmlElement("p", "legend-title", `+${visible.length - 6} in filters`));
      }

      function renderTypes() {
        const filters = document.getElementById("type-filters");
        const boundaryLegend = document.getElementById("boundary-legend");
        const connectionLegend = document.getElementById("connection-legend");
        const legend = document.getElementById("legend");
        filters.replaceChildren();
        boundaryLegend.replaceChildren();
        connectionLegend.replaceChildren();
        legend.replaceChildren();
        for (const type of types) {
          const label = htmlElement("label", "filter");
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = state.enabledTypes.has(type);
          checkbox.addEventListener("change", () => {
            if (checkbox.checked) state.enabledTypes.add(type);
            else state.enabledTypes.delete(type);
            explorer.page = 0;
            projectView(true);
          });
          label.append(checkbox, htmlElement("code", "type-key", TAGS[type] || "MODULE"), document.createTextNode(type));
          filters.append(label);
        }
        for (const boundary of boundaries) {
          const row = applyBoundaryStyle(htmlElement("div", "legend-row"), boundary);
          row.append(htmlElement("span", "boundary-chip"), document.createTextNode(boundary));
          boundaryLegend.append(row.cloneNode(true));
        }
        for (const type of EDGE_TYPES) {
          const row = htmlElement("div", "legend-row");
          const key = htmlElement("span", "edge-key");
          key.dataset.edgeType = type;
          row.append(key, document.createTextNode(type));
          connectionLegend.append(row);
        }
        for (const [name, meaning] of STATES) {
          const row = htmlElement("div", "legend-row");
          const chip = htmlElement("span", "rule-chip");
          chip.dataset.state = name;
          row.append(chip, document.createTextNode(meaning));
          legend.append(row);
        }
      }

      function renderFlows() {
        const list = document.getElementById("flow-list");
        list.replaceChildren();
        data.flows.forEach((flow, index) => {
          const button = htmlElement("button", "flow-button", flow.trigger);
          button.type = "button";
          if (state.selectedFlow === index) button.classList.add("active");
          if (state.selectedNode && flow.steps.includes(state.selectedNode)) button.classList.add("related");
          button.append(htmlElement("small", "", `${flow.steps.join(" \u2192 ")} \u00b7 ${flow.outcome}`));
          button.addEventListener("click", () => {
            state.selectedFlow = state.selectedFlow === index ? null : index;
            state.selectedNode = null;
            explorer.page = 0;
            explorer.connection = null;
            explorer.changes = false;
            state.query = "";
            document.getElementById("search").value = "";
            renderFlows();
            renderDetails();
            setPanel("right", true);
            projectView(true);
          });
          list.append(button);
        });
      }

      function updateStatus() {
        const unknown = data.edges.filter(edge => edge.evidence.status === "unknown").length;
        const node = data.nodes.find(item => item.id === state.selectedNode);
        const status = document.getElementById("status");
        const zoom = `${Math.round(state.view.k * 100)}%`;
        if (node) {
          const callers = (node.callers || []).length;
          const callees = (node.callees || []).length;
          const tests = (node.tests || []).length;
          status.textContent = `${node.id}  \u2190 ${callers} callers  \u2192 ${callees} callees  \u00b7 ${tests} tests  \u00b7 ${zoom}`;
          return;
        }
        status.textContent = `${state.counts.nodes} modules \u00b7 ${state.counts.edges} traces \u00b7 ${unknown} unknown \u00b7 ${zoom}`;
      }

      function setPanel(name, collapsed) {
        const shell = document.getElementById("app-shell");
        const button = document.getElementById(name === "left" ? "toggle-left" : "toggle-right");
        const panel = document.getElementById(name === "left" ? "filters-panel" : "details");
        shell.dataset[`${name}Collapsed`] = String(collapsed);
        button.setAttribute("aria-expanded", String(!collapsed));
        if (collapsed && panel.contains(document.activeElement)) button.focus();
        panel.inert = collapsed;
      }

      function togglePanel(name) {
        const shell = document.getElementById("app-shell");
        setPanel(name, shell.dataset[`${name}Collapsed`] !== "true");
      }

      function dropNode(id, deltaX, deltaY) {
        const cell = state.cells.get(id);
        const row = Math.max(0, cell.row + Math.round(deltaY / ROW_PITCH));
        const col = Math.max(0, cell.col + Math.round(deltaX / COL_PITCH));
        if (row === cell.row && col === cell.col) return false;
        const holder = [...state.cells].find(([other, value]) => other !== id && value.row === row && value.col === col);
        if (holder) state.overrides.set(holder[0], { ...cell });
        state.overrides.set(id, { row, col });
        return true;
      }

      let searchFrame = null;
      document.getElementById("search").addEventListener("input", event => {
        state.query = event.target.value;
        state.selectedFlow = null;
        explorer.connection = null;
        explorer.page = 0;
        if (searchFrame !== null) cancelAnimationFrame(searchFrame);
        searchFrame = requestAnimationFrame(() => { projectView(false); searchFrame = null; });
      });
      document.getElementById("all-modules").addEventListener("click", () => navigate("all"));
      document.getElementById("changes-view").addEventListener("click", () => { explorer.changes = !explorer.changes; explorer.page = 0; projectView(true); inspectChanges(); });
      document.getElementById("coverage-view").addEventListener("click", inspectCoverage);
      document.getElementById("page-prev").addEventListener("click", () => { explorer.page--; projectView(true); });
      document.getElementById("page-next").addEventListener("click", () => { explorer.page++; projectView(true); });
      document.addEventListener("keydown", () => { document.documentElement.dataset.input = "keyboard"; }, true);
      document.addEventListener("pointerdown", () => { document.documentElement.dataset.input = "pointer"; }, true);
      reduceMotion.addEventListener("change", () => { if (reduceMotion.matches) { const target = state.viewTarget; stopViewAnimation(); if (target) setView(target); document.getAnimations().forEach(animation => animation.cancel()); } });
      document.getElementById("zoom-in").addEventListener("click", () => setZoom(1.2));
      document.getElementById("zoom-out").addEventListener("click", () => setZoom(1 / 1.2));
      document.getElementById("fit").addEventListener("click", () => fitMap({ animate: !keyboardInput(), overview: true }));
      document.getElementById("focus-connections").addEventListener("click", () => focusConnections());
      document.getElementById("toggle-left").addEventListener("click", () => togglePanel("left"));
      document.getElementById("toggle-right").addEventListener("click", () => togglePanel("right"));
      document.getElementById("app-shell").addEventListener("transitionend", event => {
        if (event.propertyName === "grid-template-columns") refitCurrentView();
      });
      const preventCanvasSelection = event => event.preventDefault();
      svg.addEventListener("selectstart", preventCanvasSelection);
      svg.addEventListener("dragstart", preventCanvasSelection);
      svg.addEventListener("wheel", event => { event.preventDefault(); const rect = svg.getBoundingClientRect(); setZoom(Math.exp(-Math.max(-100, Math.min(100, event.deltaY)) * .002), { x: event.clientX - rect.left, y: event.clientY - rect.top }, false); }, { passive: false });
      svg.addEventListener("pointerdown", event => {
        if (event.target.closest?.(".node")) return;
        stopViewAnimation();
        state.skipCanvasClick = false;
        svg.setPointerCapture(event.pointerId);
        state.pan = { pointerId: event.pointerId, x: event.clientX, y: event.clientY, start: { ...state.view } };
      });
      svg.addEventListener("pointermove", event => {
        if (state.drag?.pointerId === event.pointerId) {
          const deltaX = (event.clientX - state.drag.x) / state.view.k;
          const deltaY = (event.clientY - state.drag.y) / state.view.k;
          if (Math.abs(deltaX) > 3 || Math.abs(deltaY) > 3) state.drag.moved = true;
          state.drag.offset = { x: deltaX, y: deltaY };
          const group = viewport.querySelector(`[data-node-id="${CSS.escape(state.drag.id)}"]`);
          if (group) group.setAttribute("transform", `translate(${state.drag.start.x + deltaX} ${state.drag.start.y + deltaY})`);
        } else if (state.pan?.pointerId === event.pointerId) {
          state.view.x = state.pan.start.x + event.clientX - state.pan.x;
          state.view.y = state.pan.start.y + event.clientY - state.pan.y;
          applyTransform();
        }
      });
      svg.addEventListener("pointerup", event => {
        if (state.drag?.pointerId === event.pointerId) {
          const drag = state.drag;
          state.drag = null;
          state.skipCanvasClick = true;
          if (drag.moved) {
            // Redraw even when the drop snaps back, so no node keeps an off-grid transform.
            dropNode(drag.id, drag.offset.x, drag.offset.y);
            draw();
          } else selectNode(drag.id);
        }
        if (state.pan?.pointerId === event.pointerId) state.pan = null;
        if (svg.hasPointerCapture(event.pointerId)) svg.releasePointerCapture(event.pointerId);
      });
      svg.addEventListener("pointercancel", () => { state.drag = null; state.pan = null; stopViewAnimation(); draw(); });
      svg.addEventListener("click", event => {
        if (state.skipCanvasClick) {
          state.skipCanvasClick = false;
          return;
        }
        if (event.target === svg || event.target.classList.contains("map-bg")) {
          state.selectedNode = null;
          state.selectedFlow = null;
          renderDetails();
          renderFlows();
          setPanel("right", true);
          projectView(false);
        }
      });
      window.addEventListener("resize", refitCurrentView);
      document.addEventListener("keydown", event => {
        if (event.key === "/" && !event.target.closest?.("input, textarea, [contenteditable]")) {
          event.preventDefault();
          document.getElementById("search").focus();
          return;
        }
        if (!event.defaultPrevented && event.key.toLowerCase() === "f" && state.selectedNode && !event.target.closest?.("input, button")) {
          event.preventDefault();
          focusConnections(state.selectedNode, { animate: false });
          return;
        }
        if (event.key !== "Escape") return;
        const selectedNode = state.selectedNode;
        const selectedFlow = state.selectedFlow;
        state.selectedNode = null;
        state.selectedFlow = null;
        renderDetails();
        renderFlows();
        setPanel("right", true);
        projectView(false);
        requestAnimationFrame(() => {
          if (selectedNode) viewport.querySelector(`[data-node-id="${CSS.escape(selectedNode)}"]`)?.focus();
          else if (selectedFlow !== null) document.querySelectorAll(".flow-button")[selectedFlow]?.focus();
        });
      });

      renderTypes();
      renderFlows();
      projectView(false);
      setPanel("left", true);
      setPanel("right", true);
    })();
  </script>
</body>
</html>
